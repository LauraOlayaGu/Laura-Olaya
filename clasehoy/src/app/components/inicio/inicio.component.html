<div class="contenedor-principal">
  <div class="card" *ngFor="let poke of listaPokemones">
    
    <div class="foto-container">
      <img [src]="poke.imagen" alt="Foto del pokemon">
    </div>

    <div class="descripcion-container">
      <p>{{ poke.descripcion }}</p>
    </div>
    
  </div>
</div>
